<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="50%" style="stop-color:#0c1631"/>
      <stop offset="100%" style="stop-color:#0c4a6e"/>
    </linearGradient>
    <linearGradient id="trackGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#38bdf8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="speedLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="100" cy="30" r="1" fill="#64748b" opacity="0.5"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="250" cy="55" r="1.2" fill="#64748b" opacity="0.4"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="450" cy="25" r="0.8" fill="#64748b" opacity="0.6"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="45" r="1" fill="#64748b" opacity="0.3"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="800" cy="20" r="1.3" fill="#64748b" opacity="0.5"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="950" cy="60" r="0.9" fill="#64748b" opacity="0.4"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="1100" cy="35" r="1.1" fill="#64748b" opacity="0.6"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/></circle>

  <!-- Railway tracks (two parallel lines) -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1e3a5f" stroke-width="2"/>
  <line x1="0" y1="220" x2="1200" y2="220" stroke="#1e3a5f" stroke-width="2"/>

  <!-- Track sleepers -->
  <g stroke="#1e3a5f" stroke-width="1.5" opacity="0.5">
    <line x1="30" y1="208" x2="30" y2="222"/><line x1="60" y1="208" x2="60" y2="222"/>
    <line x1="90" y1="208" x2="90" y2="222"/><line x1="120" y1="208" x2="120" y2="222"/>
    <line x1="150" y1="208" x2="150" y2="222"/><line x1="180" y1="208" x2="180" y2="222"/>
    <line x1="210" y1="208" x2="210" y2="222"/><line x1="240" y1="208" x2="240" y2="222"/>
    <line x1="270" y1="208" x2="270" y2="222"/><line x1="300" y1="208" x2="300" y2="222"/>
    <line x1="330" y1="208" x2="330" y2="222"/><line x1="360" y1="208" x2="360" y2="222"/>
    <line x1="390" y1="208" x2="390" y2="222"/><line x1="420" y1="208" x2="420" y2="222"/>
    <line x1="450" y1="208" x2="450" y2="222"/><line x1="480" y1="208" x2="480" y2="222"/>
    <line x1="510" y1="208" x2="510" y2="222"/><line x1="540" y1="208" x2="540" y2="222"/>
    <line x1="570" y1="208" x2="570" y2="222"/><line x1="600" y1="208" x2="600" y2="222"/>
    <line x1="630" y1="208" x2="630" y2="222"/><line x1="660" y1="208" x2="660" y2="222"/>
    <line x1="690" y1="208" x2="690" y2="222"/><line x1="720" y1="208" x2="720" y2="222"/>
    <line x1="750" y1="208" x2="750" y2="222"/><line x1="780" y1="208" x2="780" y2="222"/>
    <line x1="810" y1="208" x2="810" y2="222"/><line x1="840" y1="208" x2="840" y2="222"/>
    <line x1="870" y1="208" x2="870" y2="222"/><line x1="900" y1="208" x2="900" y2="222"/>
    <line x1="930" y1="208" x2="930" y2="222"/><line x1="960" y1="208" x2="960" y2="222"/>
    <line x1="990" y1="208" x2="990" y2="222"/><line x1="1020" y1="208" x2="1020" y2="222"/>
    <line x1="1050" y1="208" x2="1050" y2="222"/><line x1="1080" y1="208" x2="1080" y2="222"/>
    <line x1="1110" y1="208" x2="1110" y2="222"/><line x1="1140" y1="208" x2="1140" y2="222"/>
    <line x1="1170" y1="208" x2="1170" y2="222"/>
  </g>

  <!-- Glowing track highlight that moves -->
  <rect x="-300" y="209" width="300" height="3" fill="url(#trackGlow)" filter="url(#glow)" opacity="0.8">
    <animate attributeName="x" from="-300" to="1200" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="-300" y="219" width="300" height="3" fill="url(#trackGlow)" filter="url(#glow)" opacity="0.8">
    <animate attributeName="x" from="-300" to="1200" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Speed lines behind train -->
  <g opacity="0.4">
    <line x1="0" y1="185" x2="120" y2="185" stroke="url(#speedLine)" stroke-width="1">
      <animate attributeName="x1" values="-200;1200" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-80;1320" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="190" x2="180" y2="190" stroke="url(#speedLine)" stroke-width="1.5">
      <animate attributeName="x1" values="-250;1200" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-70;1380" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="195" x2="150" y2="195" stroke="url(#speedLine)" stroke-width="1">
      <animate attributeName="x1" values="-180;1200" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-30;1350" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="200" x2="200" y2="200" stroke="url(#speedLine)" stroke-width="2">
      <animate attributeName="x1" values="-300;1200" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-100;1400" dur="3s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- TRAIN (moves left to right) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-280 0" to="1300 0" dur="3s" repeatCount="indefinite"/>

    <!-- Train body shadow -->
    <rect x="0" y="175" rx="4" ry="4" width="250" height="36" fill="#000" opacity="0.3" transform="translate(2,2)"/>

    <!-- Train body -->
    <rect x="0" y="175" rx="4" ry="4" width="250" height="36" fill="#e2e8f0"/>

    <!-- Train nose (aerodynamic front) -->
    <polygon points="250,175 280,190 280,200 250,211" fill="#e2e8f0"/>
    <polygon points="250,175 280,190 280,195 250,195" fill="#0284c7"/>

    <!-- Blue stripe -->
    <rect x="0" y="185" width="250" height="8" fill="#0284c7"/>
    <polygon points="250,185 275,192 275,196 250,193" fill="#0284c7"/>

    <!-- Windows -->
    <rect x="15" y="177" width="18" height="7" rx="1" fill="#38bdf8" opacity="0.8"/>
    <rect x="38" y="177" width="18" height="7" rx="1" fill="#38bdf8" opacity="0.8"/>
    <rect x="61" y="177" width="18" height="7" rx="1" fill="#38bdf8" opacity="0.8"/>
    <rect x="84" y="177" width="18" height="7" rx="1" fill="#38bdf8" opacity="0.8"/>
    <rect x="107" y="177" width="18" height="7" rx="1" fill="#38bdf8" opacity="0.8"/>
    <rect x="130" y="177" width="18" height="7" rx="1" fill="#38bdf8" opacity="0.8"/>
    <rect x="153" y="177" width="18" height="7" rx="1" fill="#38bdf8" opacity="0.8"/>
    <rect x="176" y="177" width="18" height="7" rx="1" fill="#38bdf8" opacity="0.8"/>
    <rect x="199" y="177" width="18" height="7" rx="1" fill="#38bdf8" opacity="0.8"/>
    <rect x="222" y="177" width="18" height="7" rx="1" fill="#38bdf8" opacity="0.8"/>

    <!-- Headlight glow -->
    <circle cx="278" cy="195" r="4" fill="#fbbf24" filter="url(#glowStrong)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="0.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Wheels -->
    <circle cx="30" cy="213" r="5" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <circle cx="60" cy="213" r="5" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <circle cx="120" cy="213" r="5" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <circle cx="150" cy="213" r="5" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <circle cx="210" cy="213" r="5" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <circle cx="240" cy="213" r="5" fill="#334155" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- Station dots on track -->
  <g filter="url(#glow)">
    <circle cx="200" cy="215" r="4" fill="#10b981" opacity="0.7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="215" r="4" fill="#10b981" opacity="0.7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="215" r="4" fill="#10b981" opacity="0.7"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="215" r="4" fill="#10b981" opacity="0.7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Title Text -->
  <text x="600" y="90" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="bold" fill="white" filter="url(#glow)">⚡ RAILPULSE</text>
  <text x="600" y="125" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#94a3b8" letter-spacing="4">REAL-TIME INDIAN RAILWAYS TELEMETRY ENGINE</text>

  <!-- Signal lights -->
  <g transform="translate(50, 140)">
    <rect x="0" y="0" width="14" height="40" rx="3" fill="#1e293b"/>
    <circle cx="7" cy="10" r="4" fill="#ef4444" opacity="0.2"/>
    <circle cx="7" cy="22" r="4" fill="#eab308" opacity="0.2"/>
    <circle cx="7" cy="34" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <line x1="7" y1="40" x2="7" y2="68" stroke="#1e293b" stroke-width="3"/>
  </g>

  <!-- Signal lights right -->
  <g transform="translate(1136, 140)">
    <rect x="0" y="0" width="14" height="40" rx="3" fill="#1e293b"/>
    <circle cx="7" cy="10" r="4" fill="#ef4444" opacity="0.2"/>
    <circle cx="7" cy="22" r="4" fill="#eab308" opacity="0.2"/>
    <circle cx="7" cy="34" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <line x1="7" y1="40" x2="7" y2="68" stroke="#1e293b" stroke-width="3"/>
  </g>

  <!-- Bottom text -->
  <text x="600" y="260" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#475569" letter-spacing="2">NEXT.JS 14 • TYPESCRIPT • MAPLIBRE GL • WEBGL 2.0 • 60 FPS • SUB-300MS SYNC</text>

  <!-- Gradient fade edges -->
  <rect x="0" y="0" width="80" height="300" fill="url(#bg)" opacity="0.5"/>
</svg>
