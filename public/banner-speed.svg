<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#020617"/><stop offset="50%" style="stop-color:#0c1631"/><stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="120" fill="url(#bg)"/>
  <!-- Speed bars animated -->
  <g>
    <rect x="200" y="50" width="0" height="8" rx="2" fill="#22c55e" filter="url(#g)">
      <animate attributeName="width" values="0;700;700;0" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="190" y="58" text-anchor="end" font-family="monospace" font-size="9" fill="#475569">p50</text>
    <rect x="200" y="65" width="0" height="8" rx="2" fill="#f59e0b" filter="url(#g)">
      <animate attributeName="width" values="0;500;500;0" dur="4s" repeatCount="indefinite" begin="0.3s"/>
    </rect>
    <text x="190" y="73" text-anchor="end" font-family="monospace" font-size="9" fill="#475569">p99</text>
    <rect x="200" y="80" width="0" height="8" rx="2" fill="#ef4444" filter="url(#g)">
      <animate attributeName="width" values="0;300;300;0" dur="4s" repeatCount="indefinite" begin="0.6s"/>
    </rect>
    <text x="190" y="88" text-anchor="end" font-family="monospace" font-size="9" fill="#475569">FPS</text>
  </g>
  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#22c55e" filter="url(#g)" letter-spacing="8">📊 SPEED TEST</text>
  <!-- Speedometer arc -->
  <g transform="translate(1050,70)">
    <path d="M-30,0 A30,30 0 0,1 30,0" fill="none" stroke="#1e3a5f" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="-25" stroke="#22c55e" stroke-width="2" transform="rotate(-60)">
      <animateTransform attributeName="transform" type="rotate" values="-90;60;60;-90" dur="4s" repeatCount="indefinite"/>
    </line>
    <circle cx="0" cy="0" r="3" fill="#22c55e"/>
  </g>
  <g transform="translate(150,70)">
    <path d="M-30,0 A30,30 0 0,1 30,0" fill="none" stroke="#1e3a5f" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="-25" stroke="#22c55e" stroke-width="2" transform="rotate(-60)">
      <animateTransform attributeName="transform" type="rotate" values="-90;60;60;-90" dur="4s" repeatCount="indefinite"/>
    </line>
    <circle cx="0" cy="0" r="3" fill="#22c55e"/>
  </g>
</svg>
