<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="50%" style="stop-color:#0c1631"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#38bdf8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:0"/>
    </linearGradient>
    <filter id="g2">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="80" fill="url(#bg2)"/>

  <!-- Double track lines -->
  <line x1="0" y1="38" x2="1200" y2="38" stroke="#1e3a5f" stroke-width="1.5"/>
  <line x1="0" y1="42" x2="1200" y2="42" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Sleepers -->
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.4">
    <line x1="20" y1="36" x2="20" y2="44"/><line x1="40" y1="36" x2="40" y2="44"/>
    <line x1="60" y1="36" x2="60" y2="44"/><line x1="80" y1="36" x2="80" y2="44"/>
    <line x1="100" y1="36" x2="100" y2="44"/><line x1="120" y1="36" x2="120" y2="44"/>
    <line x1="140" y1="36" x2="140" y2="44"/><line x1="160" y1="36" x2="160" y2="44"/>
    <line x1="180" y1="36" x2="180" y2="44"/><line x1="200" y1="36" x2="200" y2="44"/>
    <line x1="220" y1="36" x2="220" y2="44"/><line x1="240" y1="36" x2="240" y2="44"/>
    <line x1="260" y1="36" x2="260" y2="44"/><line x1="280" y1="36" x2="280" y2="44"/>
    <line x1="300" y1="36" x2="300" y2="44"/><line x1="320" y1="36" x2="320" y2="44"/>
    <line x1="340" y1="36" x2="340" y2="44"/><line x1="360" y1="36" x2="360" y2="44"/>
    <line x1="380" y1="36" x2="380" y2="44"/><line x1="400" y1="36" x2="400" y2="44"/>
    <line x1="420" y1="36" x2="420" y2="44"/><line x1="440" y1="36" x2="440" y2="44"/>
    <line x1="460" y1="36" x2="460" y2="44"/><line x1="480" y1="36" x2="480" y2="44"/>
    <line x1="500" y1="36" x2="500" y2="44"/><line x1="520" y1="36" x2="520" y2="44"/>
    <line x1="540" y1="36" x2="540" y2="44"/><line x1="560" y1="36" x2="560" y2="44"/>
    <line x1="580" y1="36" x2="580" y2="44"/><line x1="600" y1="36" x2="600" y2="44"/>
    <line x1="620" y1="36" x2="620" y2="44"/><line x1="640" y1="36" x2="640" y2="44"/>
    <line x1="660" y1="36" x2="660" y2="44"/><line x1="680" y1="36" x2="680" y2="44"/>
    <line x1="700" y1="36" x2="700" y2="44"/><line x1="720" y1="36" x2="720" y2="44"/>
    <line x1="740" y1="36" x2="740" y2="44"/><line x1="760" y1="36" x2="760" y2="44"/>
    <line x1="780" y1="36" x2="780" y2="44"/><line x1="800" y1="36" x2="800" y2="44"/>
    <line x1="820" y1="36" x2="820" y2="44"/><line x1="840" y1="36" x2="840" y2="44"/>
    <line x1="860" y1="36" x2="860" y2="44"/><line x1="880" y1="36" x2="880" y2="44"/>
    <line x1="900" y1="36" x2="900" y2="44"/><line x1="920" y1="36" x2="920" y2="44"/>
    <line x1="940" y1="36" x2="940" y2="44"/><line x1="960" y1="36" x2="960" y2="44"/>
    <line x1="980" y1="36" x2="980" y2="44"/><line x1="1000" y1="36" x2="1000" y2="44"/>
    <line x1="1020" y1="36" x2="1020" y2="44"/><line x1="1040" y1="36" x2="1040" y2="44"/>
    <line x1="1060" y1="36" x2="1060" y2="44"/><line x1="1080" y1="36" x2="1080" y2="44"/>
    <line x1="1100" y1="36" x2="1100" y2="44"/><line x1="1120" y1="36" x2="1120" y2="44"/>
    <line x1="1140" y1="36" x2="1140" y2="44"/><line x1="1160" y1="36" x2="1160" y2="44"/>
    <line x1="1180" y1="36" x2="1180" y2="44"/>
  </g>

  <!-- Pulsing light that travels along the track -->
  <rect x="-200" y="37" width="200" height="6" fill="url(#pulse)" filter="url(#g2)" opacity="0.9">
    <animate attributeName="x" from="-200" to="1200" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Small train silhouette running -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-120 0" to="1250 0" dur="4s" repeatCount="indefinite"/>
    <rect x="0" y="28" rx="2" ry="2" width="100" height="12" fill="#e2e8f0"/>
    <polygon points="100,28 115,34 100,40" fill="#e2e8f0"/>
    <rect x="0" y="32" width="100" height="3" fill="#0284c7"/>
    <circle cx="112" cy="34" r="2" fill="#fbbf24" filter="url(#g2)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="15" cy="41" r="2.5" fill="#334155"/>
    <circle cx="35" cy="41" r="2.5" fill="#334155"/>
    <circle cx="65" cy="41" r="2.5" fill="#334155"/>
    <circle cx="85" cy="41" r="2.5" fill="#334155"/>
  </g>

  <!-- Station markers -->
  <circle cx="300" cy="40" r="3" fill="#10b981" filter="url(#g2)"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="40" r="3" fill="#10b981" filter="url(#g2)"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="900" cy="40" r="3" fill="#10b981" filter="url(#g2)"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/></circle>
</svg>
