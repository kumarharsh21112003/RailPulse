<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#020617"/><stop offset="50%" style="stop-color:#0c1631"/><stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="120" fill="url(#bg)"/>
  <!-- Cockpit / Driver Cabin Gauge Display -->
  <g transform="translate(120,60)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1e3a5f" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="0" y1="0" x2="12" y2="-12" stroke="#38bdf8" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="-40;45;-40" dur="3s" repeatCount="indefinite"/>
    </line>
    <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
    <text x="0" y="38" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">THROTTLE</text>
  </g>
  <g transform="translate(1080,60)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1e3a5f" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="0" y1="0" x2="-8" y2="-15" stroke="#22c55e" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="-20;60;-20" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <circle cx="0" cy="0" r="3" fill="#22c55e"/>
    <text x="0" y="38" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">PRESSURE</text>
  </g>
  <!-- HUD crosshair line -->
  <line x1="200" y1="60" x2="420" y2="60" stroke="#1e3a5f" stroke-width="1"/>
  <line x1="780" y1="60" x2="1000" y2="60" stroke="#1e3a5f" stroke-width="1"/>
  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#38bdf8" filter="url(#g)" letter-spacing="8">👨‍✈️ LOCO PILOT CABIN</text>
  <text x="600" y="75" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8" letter-spacing="4">KUMAR HARSH • CHIEF LOCOMOTIVE ENGINEER</text>
</svg>
