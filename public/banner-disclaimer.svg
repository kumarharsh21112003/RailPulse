<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#020617"/><stop offset="50%" style="stop-color:#1c1917"/><stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="120" fill="url(#bg)"/>
  <!-- Warning Hazard Stripes on sides -->
  <g opacity="0.3">
    <line x1="40" y1="20" x2="60" y2="100" stroke="#f59e0b" stroke-width="6"/>
    <line x1="60" y1="20" x2="80" y2="100" stroke="#f59e0b" stroke-width="6"/>
    <line x1="80" y1="20" x2="100" y2="100" stroke="#f59e0b" stroke-width="6"/>
    <line x1="1100" y1="20" x2="1120" y2="100" stroke="#f59e0b" stroke-width="6"/>
    <line x1="1120" y1="20" x2="1140" y2="100" stroke="#f59e0b" stroke-width="6"/>
    <line x1="1140" y1="20" x2="1160" y2="100" stroke="#f59e0b" stroke-width="6"/>
  </g>
  <!-- Pulsing Warning Triangle -->
  <g transform="translate(180,60)">
    <polygon points="0,-22 22,18 -22,18" fill="none" stroke="#f59e0b" stroke-width="2" filter="url(#g)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
    </polygon>
    <text x="0" y="10" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="18" fill="#f59e0b">!</text>
  </g>
  <g transform="translate(1020,60)">
    <polygon points="0,-22 22,18 -22,18" fill="none" stroke="#f59e0b" stroke-width="2" filter="url(#g)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
    </polygon>
    <text x="0" y="10" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="18" fill="#f59e0b">!</text>
  </g>
  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#f59e0b" filter="url(#g)" letter-spacing="8">⚠️ NOTICE &amp; DISCLAIMER</text>
  <text x="600" y="78" text-anchor="middle" font-family="monospace" font-size="11" fill="#78716c" letter-spacing="3">ACADEMIC &amp; RESEARCH USE ONLY • NOT AN OFFICIAL IRCTC / CRIS SERVICE</text>
</svg>
