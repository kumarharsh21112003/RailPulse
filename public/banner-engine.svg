<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#020617"/><stop offset="50%" style="stop-color:#0c1631"/><stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="120" fill="url(#bg)"/>
  <!-- Signal poles -->
  <g>
    <rect x="80" y="15" width="10" height="55" rx="2" fill="#1e293b"/>
    <circle cx="85" cy="25" r="5" fill="#ef4444" opacity="0.15"/>
    <circle cx="85" cy="38" r="5" fill="#eab308" opacity="0.15"/>
    <circle cx="85" cy="51" r="5" fill="#22c55e"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/></circle>
    <line x1="85" y1="70" x2="85" y2="95" stroke="#1e293b" stroke-width="3"/>
  </g>
  <g>
    <rect x="1110" y="15" width="10" height="55" rx="2" fill="#1e293b"/>
    <circle cx="1115" cy="25" r="5" fill="#ef4444" opacity="0.15"/>
    <circle cx="1115" cy="38" r="5" fill="#eab308"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1115" cy="51" r="5" fill="#22c55e" opacity="0.15"/>
    <line x1="1115" y1="70" x2="1115" y2="95" stroke="#1e293b" stroke-width="3"/>
  </g>
  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#f59e0b" filter="url(#g)" letter-spacing="10">🔧 UNDER THE HOOD</text>
  <text x="600" y="75" text-anchor="middle" font-family="monospace" font-size="12" fill="#475569" letter-spacing="3">SIGNALING • GEODESICS • TELEMETRY FAILOVER</text>
  <!-- Electric sparks -->
  <g filter="url(#g)">
    <line x1="200" y1="95" x2="220" y2="90" stroke="#38bdf8" stroke-width="1" opacity="0.6"><animate attributeName="opacity" values="0;0.8;0" dur="1.5s" repeatCount="indefinite"/></line>
    <line x1="220" y1="90" x2="215" y2="85" stroke="#38bdf8" stroke-width="1" opacity="0.6"><animate attributeName="opacity" values="0;0.8;0" dur="1.5s" repeatCount="indefinite"/></line>
    <line x1="980" y1="95" x2="1000" y2="88" stroke="#38bdf8" stroke-width="1" opacity="0.6"><animate attributeName="opacity" values="0;0.7;0" dur="2s" repeatCount="indefinite"/></line>
    <line x1="1000" y1="88" x2="995" y2="82" stroke="#38bdf8" stroke-width="1" opacity="0.6"><animate attributeName="opacity" values="0;0.7;0" dur="2s" repeatCount="indefinite"/></line>
  </g>
  <!-- Bottom OHE wire -->
  <line x1="0" y1="100" x2="1200" y2="100" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="300" cy="100" r="2" fill="#38bdf8" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="1s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="100" r="2" fill="#38bdf8" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.3s" repeatCount="indefinite"/></circle>
  <circle cx="900" cy="100" r="2" fill="#38bdf8" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="0.9s" repeatCount="indefinite"/></circle>
</svg>
