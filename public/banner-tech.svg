<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#020617"/><stop offset="50%" style="stop-color:#0c1631"/><stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="120" fill="url(#bg)"/>
  <!-- Route line -->
  <line x1="100" y1="80" x2="1100" y2="80" stroke="#1e3a5f" stroke-width="3"/>
  <!-- Station dots with labels -->
  <g filter="url(#g)">
    <circle cx="150" cy="80" r="6" fill="#000" stroke="#22c55e" stroke-width="2"><animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/></circle>
    <text x="150" y="70" text-anchor="middle" font-family="monospace" font-size="8" fill="#22c55e">Next.js</text>
    <circle cx="300" cy="80" r="6" fill="#000" stroke="#3178c6" stroke-width="2"><animate attributeName="r" values="5;7;5" dur="2.3s" repeatCount="indefinite"/></circle>
    <text x="300" y="70" text-anchor="middle" font-family="monospace" font-size="8" fill="#3178c6">TypeScript</text>
    <circle cx="450" cy="80" r="6" fill="#000" stroke="#8b5cf6" stroke-width="2"><animate attributeName="r" values="5;7;5" dur="2.6s" repeatCount="indefinite"/></circle>
    <text x="450" y="70" text-anchor="middle" font-family="monospace" font-size="8" fill="#8b5cf6">MapLibre</text>
    <circle cx="600" cy="80" r="6" fill="#000" stroke="#06b6d4" stroke-width="2"><animate attributeName="r" values="5;7;5" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="600" y="70" text-anchor="middle" font-family="monospace" font-size="8" fill="#06b6d4">Turf.js</text>
    <circle cx="750" cy="80" r="6" fill="#000" stroke="#f59e0b" stroke-width="2"><animate attributeName="r" values="5;7;5" dur="2.1s" repeatCount="indefinite"/></circle>
    <text x="750" y="70" text-anchor="middle" font-family="monospace" font-size="8" fill="#f59e0b">Zustand</text>
    <circle cx="900" cy="80" r="6" fill="#000" stroke="#ec4899" stroke-width="2"><animate attributeName="r" values="5;7;5" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="900" y="70" text-anchor="middle" font-family="monospace" font-size="8" fill="#ec4899">Tailwind</text>
    <circle cx="1050" cy="80" r="6" fill="#000" stroke="#ef4444" stroke-width="2"><animate attributeName="r" values="5;7;5" dur="1.9s" repeatCount="indefinite"/></circle>
    <text x="1050" y="70" text-anchor="middle" font-family="monospace" font-size="8" fill="#ef4444">PWA</text>
  </g>
  <!-- Moving dot along route -->
  <circle r="4" fill="#38bdf8" filter="url(#g)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M150,80 L300,80 L450,80 L600,80 L750,80 L900,80 L1050,80"/>
  </circle>
  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#38bdf8" filter="url(#g)" letter-spacing="8">🛠️ TECH STACK</text>
  <text x="600" y="110" text-anchor="middle" font-family="monospace" font-size="10" fill="#475569">ORIGIN ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ DEPLOYED</text>
</svg>
